[project]
name = "content-pipeline"
version = "0.1.0"
description = "Zero-key content repurposing pipeline: long-form video -> clips + platform posts."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
content-pipeline = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
